name: CI

# Fast, fully offline. Runs on every push to main and every pull request.
# Live (network) tests live in live.yml and never block a PR.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv --python "${{ matrix.python-version }}" .venv-local
          uv pip install --python .venv-local/bin/python -e ".[dev]"
      - name: Lint
        run: .venv-local/bin/ruff check src tests
      - name: Type check (strict)
        run: .venv-local/bin/pyright
      - name: Test (offline)
        run: .venv-local/bin/python -m pytest -q

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Wheel installs without the ingest extra
        run: |
          uv venv /tmp/plain
          uv pip install --python /tmp/plain/bin/python dist/*.whl
          /tmp/plain/bin/python -c "import sys, metabo_search; metabo_search.MetaboLights; metabo_search.Workbench; assert 'duckdb' not in sys.modules; assert 'pyarrow' not in sys.modules"
      - name: Wheel installs with the ingest extra
        run: |
          wheel=$(ls dist/*.whl)
          uv venv /tmp/ingest
          uv pip install --python /tmp/ingest/bin/python "${wheel}[ingest]"
          /tmp/ingest/bin/python -c "from metabo_search import Workspace; print(Workspace.__name__)"
