[project]
name = "metabo-search"
version = "0.1.0"
description = "Search metabolomics datasets, ingest the results into DuckDB, and analyse them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frederik Kämpchen" }]
requires-python = ">=3.11"
keywords = [
    "metabolomics",
    "metabolights",
    "metabolomics-workbench",
    "duckdb",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/bmds-tue/metabo-search"
Repository = "https://github.com/bmds-tue/metabo-search"
Issues = "https://github.com/bmds-tue/metabo-search/issues"

[project.optional-dependencies]
ingest = [
    "duckdb>=1.1",
    "pyarrow>=17",
]
dev = [
    "pytest>=8",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pyarrow-stubs",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metabo_search = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = [
    "live: hits the real MetaboLights/Workbench APIs (network)",
    "live_slow: live tests that fetch the whole Workbench corpus (~90 s)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv-local"
reportMissingTypeStubs = false
