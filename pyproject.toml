[project]
name = "metabo-search"
version = "0.1.0"
description = "AI-native search engine for MetaboLights datasets — find, score, and compare studies by experimental requirements"
requires-python = ">=3.11"
dependencies = [
    "metabolights-utils>=1.4.35",
    "httpx>=0.28",
    "pydantic>=2.0",
    "rapidfuzz>=3.14",  # workbench vocab matching (matcher.py)
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]