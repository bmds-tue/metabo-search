[project]
name = "metabo-search"
version = "0.1.0"
description = "Search metabolomics datasets, ingest the results into DuckDB, and analyse them"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.28",
    "pyarrow>=17",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyarrow-stubs",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metabo_search = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv-local"
reportMissingTypeStubs = false
